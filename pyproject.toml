[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tria-nf3"
version = "0.1.0"
description = "Prototipo académico de análisis de imágenes torácicas; no clínico"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.9,<1",
  "pillow>=11,<13", "numpy>=2.0,<3", "sqlalchemy>=2.0,<3",
  "reportlab>=4,<5", "pydicom>=3.0,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
ml = ["torchxrayvision==1.5.7", "torch==2.10.0", "torchvision==0.25.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tria = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
