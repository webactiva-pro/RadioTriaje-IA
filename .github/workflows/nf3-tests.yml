name: NF3 - tests de reproducibilidad
on:
  push:
    branches: ["main"]
  pull_request:
    paths: ["src/**", "tests/**", "environment/**", "pyproject.toml", ".github/workflows/nf3-tests.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Instalar dependencias sin GPU
        run: |
          python -m pip install -r environment/requirements-dev.txt
          python -m pip install -e . --no-deps
      - name: Ejecutar pruebas unitarias e integracion
        run: python -m pytest -q tests
      - name: Probar imagen de demostracion
        run: |
          python scripts/generar_imagen_demo.py
          test -s data/demo_geometrico.png
