name: NF3 - smoke IA preentrenada (no clinica)
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inferencia:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar PyTorch CPU y adaptador XRV
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0 torchvision==0.25.0
          python -m pip install -r environment/requirements-ml.txt
          python -m pip install pypdf==5.9.0
          python -m pip install -e . --no-deps
      - name: Ejecutar inferencia real, persistencia y PDF completo
        run: |
          python scripts/generar_imagen_demo.py
          python scripts/verificar_modelo_xrv.py
      - name: Guardar PDF con imagen sintética (sin datos de pacientes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tria-nf3-informe-IA-sintetica
          path: evidencias_locales/TrIA_informe_IA_sintetica.pdf
          if-no-files-found: warn
          retention-days: 7
